name: Rebuild WT comparison figures
on:
  push:
    paths:
      - 'regenerate_wt_comparisons.py'
      - 'revision_materials/reference_comparison_points_zlib64.txt'
      - '.github/workflows/rebuild_wt_comparisons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible dependencies
        run: python -m pip install --disable-pip-version-check 'matplotlib>=3.8,<4' 'pandas>=2.1,<3'
      - name: Regenerate comparison figures and verify frozen data
        run: python regenerate_wt_comparisons.py
      - name: Commit regenerated vector figures
        run: |
          git add figures_revision_comparison.pdf figures_revision_comparison_dihedral.pdf figures_revision_comparison_planform.pdf
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Rebuild WT comparison figures with visible propagated CL bars'
            git push
          fi
