name: Regenerate reference WT polar
on:
  push:
    paths:
      - 'render_reference_wt_polar.py'
      - 'figures_revision_measured_uncertainty_data.csv'
      - '.github/workflows/render_reference_wt_polar.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependencies
        run: python -m pip install --disable-pip-version-check "matplotlib>=3.8,<4" "pandas>=2.1,<3"
      - name: Generate PDF
        run: python render_reference_wt_polar.py
      - name: Commit regenerated PDF if modified
        run: |
          git add figures_revision_measured_baseline.pdf
          if git diff --cached --quiet; then
            echo "Figure already current."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Regenerate Fig. 4 using Matplotlib and propagated WT uncertainty"
            git push
          fi
